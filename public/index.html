<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Monster Quest</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="screen">
    <header class="top-frame">
      <h1>Pixel Monster Quest</h1>
      <p class="subtitle">ドラクエ × ポケモン風UIで冒険し、エンカウントでターン制バトル！</p>
    </header>

    <section class="adventure frame">
      <h3>🧭 フィールド探索</h3>
      <p class="hint">矢印キー / WASD で移動。草むらでモンスターと遭遇します。</p>
      <div id="field" class="field" aria-label="adventure-field"></div>
      <small id="location-text">現在地: (0, 0)</small>
    </section>

    <section id="battle-section" class="battle-section frame hidden">
      <h3>⚔️ バトル</h3>
      <section class="battlefield">
        <article class="status-window enemy-window">
          <h2 id="enemy-name">Enemy</h2>
          <div class="hp-bar"><span id="enemy-hp"></span></div>
          <small id="enemy-hp-text"></small>
        </article>

        <article class="sprite-stage">
          <div class="enemy-sprite sprite" id="enemy-sprite">👾</div>
          <div class="player-sprite sprite" id="player-sprite">🧙</div>
        </article>

        <article class="status-window player-window">
          <h2 id="player-name">Player</h2>
          <div class="hp-bar"><span id="player-hp"></span></div>
          <small id="player-hp-text"></small>
        </article>
      </section>

      <section class="command-area">
        <div id="log" class="dialog-window">モンスターがあらわれた！</div>
        <div id="moves" class="command-grid"></div>
      </section>
      <button id="restart" hidden>探索に戻る</button>
    </section>

    <section class="admin frame">
      <h3>🛠 DBカスタマイズ</h3>
      <div class="admin-grid">
        <form id="move-form">
          <h4>新規わざ</h4>
          <input name="name" placeholder="わざ名" required />
          <input name="power" type="number" placeholder="威力(回復はマイナス)" required />
          <input name="accuracy" type="number" min="1" max="100" placeholder="命中率" required />
          <input name="description" placeholder="説明" required />
          <button type="submit">わざ追加</button>
        </form>

        <form id="monster-form">
          <h4>新規モンスター</h4>
          <input name="name" placeholder="名前" required />
          <input name="max_hp" type="number" placeholder="HP" required />
          <input name="attack" type="number" placeholder="攻撃" required />
          <input name="defense" type="number" placeholder="防御" required />
          <input name="speed" type="number" placeholder="素早さ" required />
          <input name="sprite" placeholder="絵文字 or 文字" required />
          <label><input type="checkbox" name="is_enemy_default" /> 敵候補にする</label>
          <label>わざ割り当て</label>
          <select name="move_ids" id="move-select" multiple required></select>
          <button type="submit">モンスター追加</button>
        </form>
      </div>
      <button id="reload">DB再読み込み</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
